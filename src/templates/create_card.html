{% extends "base.html" %}
{% block title %}Create Hustle Card{% endblock %}
{% block content %}
  <div class="content">
    <h1>Create Hustle Card</h1>
    <form action="/create-card" method="POST" style="max-width: 500px; margin: 20px auto; text-align: left;" enctype="multipart/form-data">
      <div style="margin-bottom: 15px;">
        <label for="cardName" style="display: block; margin-bottom: 5px;">Card Name:</label>
        <input type="text" id="cardName" name="cardName" placeholder="e.g., Hair Braiding" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" required>
      </div>
      <div style="margin-bottom: 15px;">
        <label for="cardDescription" style="display: block; margin-bottom: 5px;">Description:</label>
        <textarea id="cardDescription" name="cardDescription" placeholder="e.g., Get your style done by pros near you." style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; height: 100px;" required></textarea>
      </div>
      <div style="margin-bottom: 15px;">
        <label for="cardImage" style="display: block; margin-bottom: 5px;">Image:</label>
        <input type="file" id="cardImage" name="cardImage" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
      </div>
      <div style="margin-bottom: 15px;">
        <label for="cardLocation" style="display: block; margin-bottom: 5px;">Location:</label>
        <input type="text" id="cardLocation" name="cardLocation" placeholder="e.g., New York, NY" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" required>
      </div>
      <div style="margin-bottom: 15px;">
        <label for="cardUser" style="display: block; margin-bottom: 5px;">User:</label>
        <input type="text" id="cardUser" name="cardUser" placeholder="e.g., user1" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" required>
      </div>
      <div style="margin-bottom: 15px;">
        <label for="cardContact" style="display: block; margin-bottom: 5px;">Contact Details:</label>
        <input type="text" id="cardContact" name="cardContact" placeholder="e.g., phone:123-456-7890" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" required>
      </div>
      <button type="submit" style="padding: 10px 20px; background-color: #20c997; color: #fff; border: none; border-radius: 8px; cursor: pointer;">Save Card</button>
    </form>
  </div>
{% endblock %}
