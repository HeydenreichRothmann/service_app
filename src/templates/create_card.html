{% extends "base.html" %}
{% block title %}Create Hustle Card{% endblock %}

{% block content %}
<div class="card-creator">
  <h1 class="page-title">🚀 Create Your Hustle Card</h1>
  
  <form action="/create-card" method="POST" enctype="multipart/form-data" class="card-form" id="cardForm">

    <!-- Image Preview Box -->
    <div class="image-upload-container">
      <label for="cardImage" class="image-label">📸 Upload Your Image</label>
      <input type="file" id="cardImage" name="cardImage" accept="image/*" onchange="previewImage(event)">
      <div class="image-preview" id="imagePreview">No image selected</div>
    </div>

    <!-- Card Name -->
    <input type="text" id="cardName" name="cardName" placeholder="What’s your hustle? (e.g., Hair Braiding)" required>

    <!-- Description -->
    <textarea id="cardDescription" name="cardDescription" placeholder="Describe your hustle..." required></textarea>

    <!-- Location, User, Contact -->
    <input type="text" id="cardLocation" name="cardLocation" placeholder="📍 Where are you based?" required>
    <input type="text" id="cardContact" name="cardContact" placeholder="📞 Contact details (e.g., 123-456-7890)" required>

    <button type="submit" class="save-btn">✨ Save Card</button>
  </form>
</div>

<style>
  .card-creator {
    max-width: 600px;
    margin: 3rem auto;
    padding: 2rem;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    font-family: 'Segoe UI', sans-serif;
  }

  .page-title {
    text-align: center;
    margin-bottom: 2rem;
    font-size: 1.8rem;
    color: #222;
  }

  .card-form {
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }

  .card-form input,
  .card-form textarea {
    padding: 0.9rem;
    font-size: 1rem;
    border: 1px solid #ddd;
    border-radius: 8px;
    transition: border 0.3s;
  }

  .card-form input:focus,
  .card-form textarea:focus {
    border-color: #20c997;
    outline: none;
  }

  textarea {
    resize: vertical;
    min-height: 100px;
  }

  .save-btn {
    background-color: #20c997;
    color: white;
    padding: 1rem;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  .save-btn:hover {
    background-color: #17a78a;
  }

  .image-upload-container {
    text-align: center;
  }

  .image-label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 600;
    color: #444;
  }

  #cardImage {
    display: block;
    margin: 0 auto 1rem;
  }

  .image-preview {
    border: 2px dashed #ccc;
    border-radius: 8px;
    padding: 1rem;
    color: #888;
    text-align: center;
    font-size: 0.95rem;
  }

  .image-preview img {
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    margin-top: 0.5rem;
  }
</style>

<!-- Google Maps API (Autocomplete) -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDiy2aO_aI9CK2aEVNF_Y55ZgIpkv9U-Vg&libraries=places"></script>

<script>
  function previewImage(event) {
    const preview = document.getElementById('imagePreview');
    const file = event.target.files[0];
    if (file) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      preview.innerHTML = '';
      preview.appendChild(img);
    } else {
      preview.textContent = 'No image selected';
    }
  }

  // Initialize Google Autocomplete
  let autocomplete;
  function initAutocomplete() {
    const input = document.getElementById('cardLocation');
    autocomplete = new google.maps.places.Autocomplete(input, {
      types: ['(cities)'],
      fields: ['geometry', 'name']
    });

    autocomplete.addListener('place_changed', () => {
      const place = autocomplete.getPlace();
      if (place.geometry) {
        injectLatLng(place.geometry.location.lat(), place.geometry.location.lng());
      }
    });
  }

  function injectLatLng(lat, lng) {
    const form = document.getElementById('cardForm');
    let latInput = document.querySelector('input[name="lat"]');
    let lngInput = document.querySelector('input[name="lng"]');

    if (!latInput) {
      latInput = document.createElement('input');
      latInput.type = 'hidden';
      latInput.name = 'lat';
      form.appendChild(latInput);
    }
    if (!lngInput) {
      lngInput = document.createElement('input');
      lngInput.type = 'hidden';
      lngInput.name = 'lng';
      form.appendChild(lngInput);
    }

    latInput.value = lat;
    lngInput.value = lng;
  }

  // Fallback: geocode manually if user skips autocomplete
  document.getElementById('cardForm').addEventListener('submit', async function (e) {
    const hasLatLng = document.querySelector('input[name="lat"]') && document.querySelector('input[name="lng"]');
    if (!hasLatLng) {
      e.preventDefault();
      const loc = document.getElementById('cardLocation').value;
      const apiKey = 'AIzaSyDiy2aO_aI9CK2aEVNF_Y55ZgIpkv9U-Vg';
      const res = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(loc)}&key=${apiKey}`);
      const data = await res.json();
      if (data.status === 'OK') {
        const coords = data.results[0].geometry.location;
        injectLatLng(coords.lat, coords.lng);
      }
      this.submit();
    }
  });

  window.onload = initAutocomplete;
</script>
{% endblock %}
