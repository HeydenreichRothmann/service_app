{% extends "base.html" %}
{% block title %}Socials{% endblock %}
{% block content %}
  <div class="content">
    <h1>Socials</h1>
    <div class="socials-card">
      <h3>Connections</h3>
      <p>Connect and manage your social media profiles here.</p>
    </div>
  </div>
  <style>
    .socials-card {
      background: #fff;
      border-radius: 15px;
      padding: 1.5rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      margin: 2rem auto;
    }

    .socials-card h3 {
      color: #2c3e50;
      margin-bottom: 0.5rem;
    }

    .socials-card p {
      color: #7f8c8d;
    }
  </style>
{% endblock %}
