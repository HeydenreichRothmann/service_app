{% extends "base.html" %}
{% block title %}Edit Cards{% endblock %}
{% block content %}
  <div class="content">
    <h1>Edit Cards</h1>
    {% if cards %}
      <div class="card-grid">
        {% for card in cards %}
          <div class="card-item">
            <form method="POST" class="edit-form">
              <input type="hidden" name="edit_index" value="{{ loop.index0 }}">
              <div class="form-group">
                <label>Name:</label>
                <input type="text" name="edit_name_{{ loop.index0 }}" value="{{ card.name }}" class="form-input">
              </div>
              <div class="form-group">
                <label>Description:</label>
                <textarea name="edit_description_{{ loop.index0 }}" class="form-input">{{ card.description }}</textarea>
              </div>
              <div class="form-group">
                <label>Location:</label>
                <input type="text" name="edit_location_{{ loop.index0 }}" value="{{ card.location }}" class="form-input">
              </div>
              <div class="form-group">
                <label>User:</label>
                <input type="text" name="edit_user_{{ loop.index0 }}" value="{{ card.user }}" class="form-input">
              </div>
              <div class="form-group">
                <label>Contact:</label>
                <input type="text" name="edit_contact_{{ loop.index0 }}" value="{{ card.contact_details }}" class="form-input">
              </div>
              <button type="submit" class="action-btn save-btn">Save Changes</button>
            </form>
            <form method="POST" class="remove-form">
              <input type="hidden" name="remove_index" value="{{ loop.index0 }}">
              <button type="submit" class="action-btn remove-btn">Remove Card</button>
            </form>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <p class="no-cards">No cards to edit.</p>
    {% endif %}
  </div>
  <style>
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .card-item {
      background: #fff;
      border-radius: 15px;
      padding: 1.5rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .card-item:hover {
      transform: translateY(-5px);
    }

    .edit-form, .remove-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.9rem;
      color: #2c3e50;
      margin-bottom: 0.25rem;
    }

    .form-input {
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }

    .form-input:focus {
      border-color: #20c997;
      outline: none;
    }

    .action-btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }

    .save-btn {
      background: linear-gradient(90deg, #20c997, #27ae60);
      color: #fff;
    }

    .save-btn:hover {
      background: linear-gradient(90deg, #1d9b7e, #219653);
      transform: translateY(-2px);
    }

    .remove-btn {
      background: linear-gradient(90deg, #e74c3c, #c0392b);
      color: #fff;
    }

    .remove-btn:hover {
      background: linear-gradient(90deg, #d32f2f, #a93226);
      transform: translateY(-2px);
    }

    .no-cards {
      color: #7f8c8d;
      font-size: 1.1rem;
    }
  </style>
{% endblock %}
