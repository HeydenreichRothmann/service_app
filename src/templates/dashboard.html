{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
  <div class="content">
    <h1>Dashboard</h1>
    <div class="dashboard-grid">
      <div class="dashboard-card">
        <h3>Stats Overview</h3>
        <p>Track your hustle progress and performance.</p>
      </div>
      <div class="dashboard-card">
        <h3>Activity</h3>
        <p>View recent updates and interactions.</p>
      </div>
    </div>
  </div>
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .dashboard-card {
      background: #fff;
      border-radius: 15px;
      padding: 1.5rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .dashboard-card:hover {
      transform: translateY(-5px);
    }

    .dashboard-card h3 {
      color: #2c3e50;
      margin-bottom: 0.5rem;
    }

    .dashboard-card p {
      color: #7f8c8d;
    }
  </style>
{% endblock %}
