{% extends "base.html" %}
{% block title %}AI Post Generator{% endblock %}
{% block content %}
  <div class="content">
    <h1>AI Post Generator</h1>
    <div class="generator-card">
      <h3>Create Posts</h3>
      <p>Generate engaging social media content with AI assistance.</p>
    </div>
  </div>
  <style>
    .generator-card {
      background: #fff;
      border-radius: 15px;
      padding: 1.5rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      margin: 2rem auto;
    }

    .generator-card h3 {
      color: #2c3e50;
      margin-bottom: 0.5rem;
    }

    .generator-card p {
      color: #7f8c8d;
    }
  </style>
{% endblock %}
