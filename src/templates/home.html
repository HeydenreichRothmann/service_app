{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}
  <div class="content">
    <button onclick="window.location.href='/create-card'" class="action-btn">Create Hustle Card</button>

    <div class="card-grid">
      {% for card in cards %}
        <a href="{{ url_for('card_detail', index=loop.index0) }}" class="card-item">
          {% if card.image %}
            <img src="{{ '/' + card.image }}" alt="{{ card.name }}" class="card-thumbnail">
          {% endif %}
          <h3>{{ card.name }}</h3>
        </a>
      {% endfor %}
    </div>
  </div>

  <style>
    .action-btn {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(90deg, #20c997, #27ae60);
      color: #fff;
      border: none;
      border-radius: 25px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(32, 201, 151, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(32, 201, 151, 0.4);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .card-item {
      background: #fff;
      border-radius: 15px;
      padding: 1rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    }

    .card-thumbnail {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 0.75rem;
    }

    .card-item h3 {
      font-size: 1.1rem;
      color: #2c3e50;
      margin: 0;
    }
  </style>
{% endblock %}
