{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}
  <div class="content">

    <div class="top-bar">
      <input type="text" id="searchInput" onkeyup="filterCards()" placeholder="Search Hustle Cards..." class="search-input">
      <button onclick="window.location.href='/create-card'" class="action-btn">Create Hustle Card</button>
    </div>

    <div class="card-grid" id="cardGrid">
      {% for card in cards %}
        <a href="{{ url_for('card_detail', index=loop.index0) }}" class="card-item">
          {% if card.image %}
            <img src="{{ '/' + card.image }}" alt="{{ card.name }}" class="card-thumbnail">
          {% endif %}
          <h3 class="card-title">{{ card.name }}</h3>
        </a>
      {% endfor %}
    </div>
  </div>

  <style>
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      padding: 0.75rem 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 25px;
      font-size: 1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      transition: border 0.2s ease;
    }

    .search-input:focus {
      border-color: #20c997;
      outline: none;
    }

    .action-btn {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(90deg, #20c997, #27ae60);
      color: #fff;
      border: none;
      border-radius: 25px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(32, 201, 151, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      white-space: nowrap;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(32, 201, 151, 0.4);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .card-item {
      background: #fff;
      border-radius: 15px;
      padding: 1rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    }

    .card-thumbnail {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.1rem;
      color: #2c3e50;
      margin: 0;
    }
  </style>

  <script>
    function filterCards() {
      const input = document.getElementById('searchInput');
      const filter = input.value.toLowerCase();
      const cards = document.querySelectorAll('.card-item');

      cards.forEach(card => {
        const title = card.querySelector('.card-title').textContent.toLowerCase();
        card.style.display = title.includes(filter) ? '' : 'none';
      });
    }
  </script>
{% endblock %}
